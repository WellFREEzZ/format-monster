{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="border-t border-gray-700 py-10">
  <div class="container mx-auto px-4 flex flex-wrap items-center justify-between gap-6">
    <div>
      <a href="/" class="flex items-center gap-3 text-white font-bold text-xl">
        <img id="footer-logo" src="{{baseUrl}}{{brandLogo}}" alt="{{brandName}}" class="h-12 w-12" />
        <span id="footer-brand">{{brandName}}</span>
      </a>
      <p id="footer-copyright" class="text-gray-400 text-sm mt-3">{{footerText}}</p>
      <p class="text-gray-400 text-xs mt-2">Version <span id="app-version">{{appVersion}}</span></p>
    </div>
    <nav class="flex flex-wrap gap-5 text-sm text-gray-300" aria-label="Footer">
      <a href="/tools" class="hover:text-indigo-300">PDF tools</a>
      <a href="/privacy" class="hover:text-indigo-300">Privacy</a>
      <a href="/terms" class="hover:text-indigo-300">Terms</a>
      <a href="https://github.com/WellFREEzZ/format-monster" class="hover:text-indigo-300">Source code · AGPL-3.0</a>
      <a href="https://github.com/alam00000/bentopdf" class="hover:text-indigo-300">BentoPDF upstream</a>
    </nav>
  </div>
</footer>
{{/if}}
