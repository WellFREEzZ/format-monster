name: Build and publish Format Monster

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-monster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm run test:run

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Format Monster
            org.opencontainers.image.description=Browser-based PDF tools powered by BentoPDF
            org.opencontainers.image.url=https://format.monster
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIMPLE_MODE=false
            DISABLE_GITHUB_STARS=true
            VITE_BRAND_NAME=Format Monster
            VITE_BRAND_LOGO=images/format-monster.svg
            VITE_FOOTER_TEXT=Format Monster · Powered by BentoPDF
            SITE_URL=https://format.monster
          cache-from: type=gha
          cache-to: type=gha,mode=max
